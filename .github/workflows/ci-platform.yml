# Level 1 of this repository and publication of the CI image (guide 501).
# Trigger only: every step is a `just` recipe (DEL-CI-002); actions are
# plumbing pinned to a commit SHA (DEL-CI-007).
name: "CI · Platform · L1 checks & CI image"

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  ci-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install just
        run: curl -fsSL https://just.systems/install.sh | bash -s -- --tag 1.59.0 --to "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: just ci-image-publish

  checks:
    needs: ci-image
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/fabiotessaro/ci:1ca35f6b7863
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: just ci
